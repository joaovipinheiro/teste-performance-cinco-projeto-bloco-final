name: CI/CD Pipeline TP5 (Gradle)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # --- CORREÇÃO AQUI: Garante permissão de execução ---
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      # ----------------------------------------------------

      # Passo obrigatório: Build com Gradle
      - name: Build with Gradle
        run: ./gradlew build

      # Passo obrigatório: Upload de Artefatos
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar
          retention-days: 1

      - name: Generate Job Summary
        if: always()
        run: echo "### Status do Build Gradle 🚀" >> $GITHUB_STEP_SUMMARY && echo "Resultado: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  # Simulação de Deploy (Requisito do TP5)
  deploy-staging:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: Staging
      url: http://staging.example.com
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
      - name: Deploy to Staging
        run: echo "Simulando deploy da versão ${{ github.sha }} em Staging..."
