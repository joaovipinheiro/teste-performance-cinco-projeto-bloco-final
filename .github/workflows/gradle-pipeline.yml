name: CI/CD Pipeline TP5

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Permite rodar manualmente

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Requisito: Build com Gradle
      - name: Build with Gradle
        run: ./gradlew build

      # Requisito: Upload de Artefatos
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar
          retention-days: 1

      # Requisito: Resumo em Markdown
      - name: Generate Job Summary
        if: always()
        run: echo "### Build Status 🚀" >> $GITHUB_STEP_SUMMARY && echo "Build finished with status ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  # Requisito: Automatização de Deploys e Ambientes
  deploy-staging:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: Staging
      url: http://staging.example.com
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
      - name: Deploy to Staging (Simulated)
        run: echo "Deploying version ${{ github.sha }} to Staging environment..."

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: Production
      url: http://production.example.com
    steps:
      - name: Deploy to Production (Simulated)
        run: echo "Deploying to Production Server..."